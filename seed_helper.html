</head>

<body>

<h1>Laxmi Textiles – Render Seed Debugger</h1>

<p>
    This page calls the deployed Django backend directly
    and displays the complete raw response.
</p>

<button onclick="seedDatabase()">
    Seed Production Database
</button>

<div id="status">
    Ready
</div>

<pre id="output">
No request made yet.
</pre>

<script>

const URL =
    "https://laxmi-server.onrender.com/api/admin/demo/";

async function seedDatabase() {

    const status = document.getElementById("status");
    const output = document.getElementById("output");

    status.textContent = "Sending seed request...";
    output.textContent = "";

    try {

        const response = await fetch(URL, {
            method: "POST",

            headers: {
                "Content-Type": "application/json",
                "Accept": "*/*"
            },

            body: JSON.stringify({
                action: "seed"
            })
        });

        const rawText = await response.text();

        status.textContent =
            "HTTP " +
            response.status +
            " " +
            response.statusText;

        output.textContent = rawText;

    } catch (error) {

        status.textContent = "REQUEST FAILED";

        output.textContent =
            error.stack || error.toString();
    }
}

</script>

</body>
